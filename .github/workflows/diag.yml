name: 연결 진단
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: apis.data.go.kr 연결 테스트 (키 없이)
        run: |
          for u in https://apis.data.go.kr/ https://www.data.go.kr/ https://www.price.go.kr/ https://www.google.com/; do
            printf '%s -> ' "$u"
            curl -sS -m 20 -o /dev/null -w 'HTTP %{http_code} connect=%{time_connect}s total=%{time_total}s\n' "$u" || echo "FAILED"
          done
          echo "runner public IP: $(curl -s -m 10 https://api.ipify.org || echo '?')"
      - name: 오퍼레이션별 응답 시간 (키는 secret, 출력은 코드·시간·크기만)
        env:
          KEY: ${{ secrets.KCA_SERVICE_KEY }}
        run: |
          for op in getStoreInfoSvc.do getProductInfoSvc.do "getProductPriceInfoSvc?goodInspectDay=20260828&goodId=1000"; do
            sep='?'; case "$op" in *\?*) sep='&';; esac
            printf '%s -> ' "${op%%\?*}"
            curl -sS -m 180 -o /dev/null -w 'HTTP %{http_code} connect=%{time_connect}s ttfb=%{time_starttransfer}s total=%{time_total}s size=%{size_download}B\n' "https://apis.data.go.kr/B551919/ProductPriceInfoService/${op}${sep}serviceKey=${KEY}" || echo "FAILED"
          done
